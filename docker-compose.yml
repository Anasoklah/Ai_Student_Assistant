services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: syrianstudybot-db
    env_file:
      - ./.env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-studybot_phase3}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  ai-service:
    build:
      context: ./src/ai-service
      dockerfile: Dockerfile
    container_name: syrianstudybot-ai-service
    env_file:
      - ./.env
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PROVIDER_PRIORITY: ${PROVIDER_PRIORITY:-opencode,gemini,groq,openrouter}
      PROVIDER_RETRY_COUNT: ${PROVIDER_RETRY_COUNT:-1}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-524288000}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_TIMEOUT_SECONDS: ${OPENCODE_TIMEOUT_SECONDS:-60}
      # Optional; blank = use the code defaults in OpenCodeService.
      # Images are only ever sent to OPENCODE_VISION_MODELS.
      OPENCODE_TEXT_MODELS: ${OPENCODE_TEXT_MODELS:-}
      OPENCODE_VISION_MODELS: ${OPENCODE_VISION_MODELS:-}
      # Per-provider model + tuning. Defaults live in Config.py; override here or in .env.
      # NOTE: mixtral-8x7b is decommissioned on Groq — do not use it.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen-2.5-72b-instruct}
      OPENROUTER_MODEL_FALLBACKS: ${OPENROUTER_MODEL_FALLBACKS:-}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-google/gemini-2.0-flash-001}
      OPENROUTER_VISION_MODEL_FALLBACKS: ${OPENROUTER_VISION_MODEL_FALLBACKS:-}
      GROQ_STRUCTURED_OUTPUT: ${GROQ_STRUCTURED_OUTPUT:-true}
      OPENROUTER_STRUCTURED_OUTPUT: ${OPENROUTER_STRUCTURED_OUTPUT:-true}
      KEYWORDS_MIN: ${KEYWORDS_MIN:-3}
      KEYWORDS_MAX: ${KEYWORDS_MAX:-7}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  backend:
    build:
      context: ./src/backend
      dockerfile: SyrianStudyBot/Dockerfile
    container_name: syrianstudybot-backend
    env_file:
      - ./.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=studybot_phase3;Username=postgres;Password=${DB_PASSWORD:-dev_password}
      AiService__BaseUrl: http://ai-service:8000
      AiService__PollingIntervalSeconds: ${AiService__PollingIntervalSeconds:-5}
      AiService__TimeoutMinutes: ${AiService__TimeoutMinutes:-500}
      AiService__Enabled: ${AiService__Enabled:-false}
      Jwt__Secret: ${Jwt__Secret:-}
      Jwt__Issuer: ${Jwt__Issuer:-YourApp}
      Jwt__Audience: ${Jwt__Audience:-YourAppUsers}
      Email__SmtpHost: ${Email__SmtpHost:-smtp.gmail.com}
      Email__SmtpPort: ${Email__SmtpPort:-587}
      Email__FromEmail: ${Email__FromEmail:-}
      Email__FromName: ${Email__FromName:-Syrian Study Bot}
      Email__Password: ${Email__Password:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      Ollama__EmbeddingModel: ${Ollama__EmbeddingModel:-nomic-embed-text}
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
